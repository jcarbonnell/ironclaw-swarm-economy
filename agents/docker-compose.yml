services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ironclaw-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ironclaw-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC (optional but recommended)
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: ironclaw-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ironclaw-agent1:
    build:
      context: https://github.com/nearai/ironclaw.git
      dockerfile: Dockerfile
    container_name: ironclaw-agent1
    command: run --no-onboard --auto-approve
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ironclaw_agent1?sslmode=disable
      NEAR_NETWORK: testnet
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: nomic-embed-text
      OLLAMA_BASE_URL: http://ollama:11434
      ONBOARD_COMPLETED: "true"
      SECRETS_MASTER_KEY: "${AGENT1_SECRETS_MASTER_KEY}"
      HTTP_ENABLED: "true"
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8081"
      HTTP_WEBHOOK_SECRET: "${AGENT1_WEBHOOK_SECRET}"
      NEARAI_MODEL: "${NEARAI_MODEL}"
      NEARAI_API_KEY: "${NEARAI_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}" 
      NOVA_ACCOUNT_ID: "${NOVA_ACCOUNT_ID_AGENT_1}" 
      NOVA_API_KEY: "${NOVA_API_KEY_AGENT_1}" 
      NOVA_GROUP_ID: "${NOVA_GROUP_ID}"
      RUST_LOG: "ironclaw=debug"
    volumes:
      - ./data/agent1:/data
      - ./data/simulation:/data/simulation
      - ./skills:/home/ironclaw/.ironclaw/skills
      - ./tools:/home/ironclaw/.ironclaw/tools
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

